<svg width="900" height="200" viewBox="0 0 900 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>
  </defs>
  
  <!-- Card background -->
  <rect width="900" height="200" rx="16" fill="url(#cardBg)"/>
  <rect width="900" height="200" rx="16" fill="none" stroke="#30363d" stroke-width="1"/>
  
  <!-- Left accent -->
  <rect x="0" y="0" width="4" height="200" rx="2" fill="url(#accent)"/>
  
  <!-- Icon -->
  <g transform="translate(40, 50)">
    <circle cx="50" cy="50" r="45" fill="#7c3aed" opacity="0.1"/>
    <circle cx="50" cy="50" r="35" fill="#7c3aed" opacity="0.2"/>
    <path d="M35 35 L50 25 L65 35 L65 65 L50 75 L35 65 Z" fill="none" stroke="#7c3aed" stroke-width="2"/>
    <path d="M50 25 L50 75" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
    <path d="M35 35 L65 65" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
    <path d="M65 35 L35 65" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- Content -->
  <text x="160" y="70" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="600" fill="#e6edf3">Privacy-First Philosophy</text>
  
  <text x="160" y="105" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#8b949e">Your code never leaves your machine. Zero telemetry, zero tracking,</text>
  <text x="160" y="125" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#8b949e">zero compromise. Built for developers who value their privacy.</text>
  
  <!-- Stats -->
  <g transform="translate(160, 145)">
    <rect x="0" y="0" width="100" height="32" rx="6" fill="#7c3aed" opacity="0.15"/>
    <text x="50" y="21" font-family="JetBrains Mono, monospace" font-size="12" fill="#7c3aed" text-anchor="middle">0% Telemetry</text>
  </g>
  <g transform="translate(275, 145)">
    <rect x="0" y="0" width="100" height="32" rx="6" fill="#00d4ff" opacity="0.15"/>
    <text x="50" y="21" font-family="JetBrains Mono, monospace" font-size="12" fill="#00d4ff" text-anchor="middle">100% Local</text>
  </g>
  <g transform="translate(390, 145)">
    <rect x="0" y="0" width="100" height="32" rx="6" fill="#27ca40" opacity="0.15"/>
    <text x="50" y="21" font-family="JetBrains Mono, monospace" font-size="12" fill="#27ca40" text-anchor="middle">Open Source</text>
  </g>
</svg>